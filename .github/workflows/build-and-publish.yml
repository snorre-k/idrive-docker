name: Build and Publish

on:
  push:
    branches: [main]
    paths:
      - "idrive/build/**"
  schedule:
    - cron: "12 9 * * *"
  workflow_dispatch:

# Serialize builds so a manual dispatch overlapping the daily schedule cannot race
# to push :latest, with the slower run silently winning.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Get iDrive version
        id: version
        run: |
          chmod +x ./idrive/version.sh
          ./idrive/version.sh

      - name: Check for new base image
        if: github.event_name != 'push'
        id: check-base
        uses: lucacome/docker-image-update-checker@3233adf42bb1dddf92f18cf024a8e202dbeaa9b3 # v3.1.0
        with:
          base-image: ubuntu:26.04
          image: snorre0815/idrive-docker:latest

      - name: Check for new iDrive version
        if: github.event_name != 'push'
        id: check-version
        uses: tyriis/docker-image-tag-exists@e73c8fdfab85076cdcf2ce4b443181fae2153675 # v2026.6.0
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}
          tag: ${{ steps.version.outputs.idrive_version }}

      - name: Determine if build is needed
        id: should-build
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "reason=push event" >> $GITHUB_OUTPUT
            echo "build=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "reason=workflow_dispatch event" >> $GITHUB_OUTPUT
            echo "build=true" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.check-base.outputs.needs-updating }}" == "true" ]]; then
            echo "reason=base image update available" >> $GITHUB_OUTPUT
            echo "build=true" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.check-version.outputs.tag }}" == "not found" ]]; then
            echo "reason=new iDrive version available" >> $GITHUB_OUTPUT
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "reason=no updates available" >> $GITHUB_OUTPUT
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.should-build.outputs.build == 'true'
        id: buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Login to DockerHub
        if: steps.should-build.outputs.build == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Github Packages
        if: steps.should-build.outputs.build == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push to Docker Hub and GitHub Container Registry
        if: steps.should-build.outputs.build == 'true'
        uses: docker/build-push-action@v7.2.0
        with:
          # relative path to the place where source code with Dockerfile is located
          context: idrive/build
          build-args: IDRIVE_URL=${{ steps.version.outputs.idrive_URL }}
          # Note: tags has to be all lower-case
          tags: |
            snorre0815/idrive-docker:latest
            snorre0815/idrive-docker:${{ steps.version.outputs.idrive_version }}
            ghcr.io/snorre-k/idrive-docker:latest
            ghcr.io/snorre-k/idrive-docker:${{ steps.version.outputs.idrive_version }}
          # build on feature branches, push only on main branch
          push: ${{ github.ref == 'refs/heads/main' }}
          # multiarch: amd64 and arm64
          platforms: linux/amd64,linux/arm64

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** ${{ steps.should-build.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status:** ${{ steps.should-build.outputs.build }}" >> $GITHUB_STEP_SUMMARY
